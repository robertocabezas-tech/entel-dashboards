<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoLogin — Distribución por Rango</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    background: #f8f7f4;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }
  .container { width: 100%; max-width: 900px; }
  .header { margin-bottom: 20px; }
  .header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #888; margin-bottom: 4px; }
  .header h2 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
  .header p { font-size: 12px; color: #999; margin-top: 4px; }
  .table-wrap { background: #ffffff; border-radius: 12px; border: 1px solid #e8e5df; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-family: 'DM Mono', 'Courier New', monospace; font-size: 12px; }
  thead th { background: #f2f0eb; color: #888; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid #e8e5df; text-align: center; }
  thead th.col-rango { text-align: left; width: 110px; }
  tbody tr { border-bottom: 1px solid #f0ede8; }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 9px 12px; text-align: center; font-variant-numeric: tabular-nums; }
  td.col-rango { text-align: left; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; padding: 0 2px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; font-size: 11px; color: #888; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .note { margin-top: 10px; font-family: 'DM Sans', sans-serif; font-size: 10px; color: #bbb; letter-spacing: 0.02em; }
  .loading { text-align: center; padding: 40px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #999; }
  .error { text-align: center; padding: 40px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #c0392b; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Entel Empresas · App B2B</h1>
    <h2>AutoLogin — Distribución por rango de tiempo</h2>
    <p id="subtitulo">Cargando datos...</p>
  </div>
  <div class="table-wrap" id="tableWrap">
    <div class="loading">Consultando BigQuery...</div>
  </div>
  <div class="legend" id="legend"></div>
  <p class="note">Intensidad por celda = variación dentro del mismo rango entre días. Colores por fila = categoría de velocidad.</p>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwwp2IAIkA7y048PRv_8JbqLgo1J_4F3Muniuq2ni7iTeQqpRQ4qqGopHQ3dp5VS-Xs1Q/exec';

const rowColors = [
  { rango: "01 a 05",   fill: "#1D9E75", text: "#ffffff", label: "01 a 05 — muy rápido" },
  { rango: "06 a 10",   fill: "#5DCAA5", text: "#064a35", label: "06 a 10 — rápido" },
  { rango: "11 a 17",   fill: "#9FE1CB", text: "#064a35", label: "11 a 17 — normal" },
  { rango: "18 a 36",   fill: "#7EB8F7", text: "#0a3d6b", label: "18 a 36 — moderado" },
  { rango: "37 a 54",   fill: "#FAC775", text: "#5a3200", label: "37 a 54 — lento" },
  { rango: "55 a 180",  fill: "#F0997B", text: "#5c200a", label: "55 a 180 — muy lento" },
  { rango: "180 a más", fill: "#D85A30", text: "#ffffff", label: "180 a más — crítico" },
];

const rangoOrder = rowColors.map(r => r.rango);

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
}

function formatFecha(fechaStr) {
  const d = new Date(fechaStr + 'T00:00:00');
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

function buildTable(rows) {
  const grouped = {};
  const fechasSet = new Set();

  rows.forEach(r => {
    if (!grouped[r.rango]) grouped[r.rango] = {};
    grouped[r.rango][r.Fecha] = parseFloat(r.pct);
    fechasSet.add(r.Fecha);
  });

  const fechas = Array.from(fechasSet).sort();
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = '';

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  const thLabel = document.createElement('th');
  thLabel.className = 'col-rango';
  thLabel.textContent = 'Rango (seg)';
  headerRow.appendChild(thLabel);
  fechas.forEach(f => {
    const th = document.createElement('th');
    th.textContent = formatFecha(f);
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rangoOrder.forEach((rango, i) => {
    if (!grouped[rango]) return;
    const color = rowColors[i];
    const tr = document.createElement('tr');

    const tdLabel = document.createElement('td');
    tdLabel.className = 'col-rango';
    tdLabel.textContent = rango;
    tdLabel.style.background = color.fill;
    tdLabel.style.color = color.text;
    tdLabel.style.borderRight = '1px solid rgba(0,0,0,0.08)';
    tr.appendChild(tdLabel);

    const vals = fechas.map(f => grouped[rango][f] ?? 0);
    const rowMin = Math.min(...vals);
    const rowMax = Math.max(...vals);

    vals.forEach(v => {
      const td = document.createElement('td');
      const norm = rowMax === rowMin ? 1 : (v - rowMin) / (rowMax - rowMin);
      const alpha = 0.12 + norm * 0.60;
      td.style.background = hexToRgba(color.fill, alpha);
      td.style.color = alpha > 0.45 ? color.text : '#333';
      td.textContent = v.toFixed(2) + '%';
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  const fechasLabel = [formatFecha(fechas[0]), formatFecha(fechas[fechas.length-1])];
  document.getElementById('subtitulo').textContent =
    `Sesiones del ${fechasLabel[0]} al ${fechasLabel[1]}, 2026 · % sobre total diario · Actualizado automáticamente`;
}

function buildLegend() {
  const legend = document.getElementById('legend');
  rowColors.forEach(c => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-swatch" style="background:${c.fill}"></div><span>${c.label}</span>`;
    legend.appendChild(item);
  });
}

async function init() {
  buildLegend();
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!data || data.length === 0) throw new Error('Sin datos');
    buildTable(data);
  } catch(e) {
    document.getElementById('tableWrap').innerHTML =
      `<div class="error">Error al cargar datos: ${e.message}<br><small>Verifica que el Web App de Apps Script esté publicado como "Anyone".</small></div>`;
    document.getElementById('subtitulo').textContent = 'Error al conectar con BigQuery';
  }
}

init();
</script>
</body>
</html>
