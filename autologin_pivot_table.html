<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoLogin — Distribución por Rango</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    background: #f8f7f4;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  .container {
    width: 100%;
    max-width: 900px;
  }

  .header {
    margin-bottom: 20px;
  }

  .header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 4px;
  }

  .header h2 {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .header p {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }

  .table-wrap {
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #e8e5df;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-family: 'DM Mono', 'Courier New', monospace;
    font-size: 12px;
  }

  thead th {
    background: #f2f0eb;
    color: #888;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 12px;
    border-bottom: 1px solid #e8e5df;
    text-align: center;
  }

  thead th.col-rango {
    text-align: left;
    width: 110px;
  }

  tbody tr {
    border-bottom: 1px solid #f0ede8;
  }

  tbody tr:last-child {
    border-bottom: none;
  }

  td {
    padding: 9px 12px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    transition: opacity 0.15s;
  }

  td.col-rango {
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-top: 14px;
    padding: 0 2px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #888;
  }

  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .note {
    margin-top: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: #bbb;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Entel Empresas · App B2B</h1>
    <h2>AutoLogin — Distribución por rango de tiempo</h2>
    <p id="subtitulo">Cargando datos...</p>
  </div>

  <div class="table-wrap">
    <table id="pivotTable"></table>
  </div>

  <div class="legend" id="legend"></div>
  <p class="note">Intensidad por celda = variación dentro del mismo rango entre días. Colores por fila = categoría de velocidad.</p>
</div>

<script>
const rowColors = [
  { fill: "#1D9E75", text: "#ffffff", label: "01 a 05 — muy rápido" },
  { fill: "#5DCAA5", text: "#064a35", label: "06 a 10 — rápido" },
  { fill: "#9FE1CB", text: "#064a35", label: "11 a 17 — normal" },
  { fill: "#7EB8F7", text: "#0a3d6b", label: "18 a 36 — moderado" },
  { fill: "#FAC775", text: "#5a3200", label: "37 a 54 — lento" },
  { fill: "#F0997B", text: "#5c200a", label: "55 a 180 — muy lento" },
  { fill: "#D85A30", text: "#ffffff", label: "180 a más — crítico" },
];

const data = [
  { rango: "01 a 05",  values: [67.52, 66.64, 67.19, 69.45, 68.10, 74.93, 73.39] },
  { rango: "06 a 10",  values: [20.08, 22.10, 21.08, 19.81, 21.29, 19.92, 21.15] },
  { rango: "11 a 17",  values: [4.54,  3.85,  4.53,  4.56,  4.37,  2.77,  2.88]  },
  { rango: "18 a 36",  values: [5.41,  5.23,  4.78,  4.26,  4.20,  1.57,  1.40]  },
  { rango: "37 a 54",  values: [0.98,  0.82,  1.00,  0.94,  0.83,  0.21,  0.50]  },
  { rango: "55 a 180", values: [0.80,  0.80,  0.81,  0.62,  0.72,  0.28,  0.29]  },
  { rango: "180 a más",values: [0.68,  0.55,  0.61,  0.36,  0.49,  0.32,  0.38]  },
];

const fechas = ["25/05", "26/05", "27/05", "28/05", "29/05", "30/05", "31/05"];

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
}

const table = document.getElementById("pivotTable");

const thead = document.createElement("thead");
const headerRow = document.createElement("tr");
const thLabel = document.createElement("th");
thLabel.className = "col-rango";
thLabel.textContent = "Rango (seg)";
headerRow.appendChild(thLabel);
fechas.forEach(f => {
  const th = document.createElement("th");
  th.textContent = f;
  headerRow.appendChild(th);
});
thead.appendChild(headerRow);
table.appendChild(thead);

const tbody = document.createElement("tbody");
data.forEach((row, i) => {
  const tr = document.createElement("tr");

  const tdLabel = document.createElement("td");
  tdLabel.className = "col-rango";
  tdLabel.textContent = row.rango;
  tdLabel.style.background = rowColors[i].fill;
  tdLabel.style.color = rowColors[i].text;
  tdLabel.style.borderRight = "1px solid rgba(0,0,0,0.08)";
  tr.appendChild(tdLabel);

  const rowMin = Math.min(...row.values);
  const rowMax = Math.max(...row.values);

  row.values.forEach(v => {
    const td = document.createElement("td");
    const norm = rowMax === rowMin ? 1 : (v - rowMin) / (rowMax - rowMin);
    const alpha = 0.12 + norm * 0.60;
    td.style.background = hexToRgba(rowColors[i].fill, alpha);
    td.style.color = alpha > 0.45 ? rowColors[i].text : "#333";
    td.textContent = v.toFixed(2) + "%";
    tr.appendChild(td);
  });

  tbody.appendChild(tr);
});
table.appendChild(tbody);

const legend = document.getElementById("legend");
rowColors.forEach(c => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-swatch" style="background:${c.fill}"></div><span>${c.label}</span>`;
  legend.appendChild(item);
});

const allDates = ["25 may", "31 may"];
document.getElementById("subtitulo").textContent =
  `Sesiones del ${allDates[0]} al ${allDates[1]}, 2026 · % sobre total diario`;
</script>

</body>
</html>
